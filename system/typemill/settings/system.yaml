fieldsetsystem:
  type: fieldset
  legend: System
  fields:
    systemhint: 
      type: paragraph
      label: 'Notice'
      description: 'Configure your website title, the copyright line, the language tags and the sitemap for your website.'
    title:
      type: text
      label: 'Website title'
      maxlength: 60
      css: lg:w-half
    author:
      type: text
      label: 'Website owner'
      css: lg:w-half
      maxlength: 60
    copyright:
      type: select
      label: 'Copyright'
      css: lg:w-half
      maxlength: 60
      description: 'Used for copyright and year in footer.'
      options:
        '©': '©'
        'CC-BY': 'CC-BY'
        'CC-BY-NC': 'CC-BY-NC'
        'CC-BY-NC-ND': 'CC-BY-NC-ND'
        'CC-BY-NC-SA': 'CC-BY-NC-SA'
        'CC-BY-ND': 'CC-BY-ND'
        'CC-BY-SA': 'CC-BY-SA'
    year:
      type: text
      label: Year
      css: lg:w-half
      maxlength: 4
      description: 'Used for copyright and year in footer.'
    language:
      type: select
      label: 'Language (author area)'
      css: lg:w-half
      maxlength: 60
      description: 'Used for translations in author area, themes, and plugins.'
      options:
        'en': 'English'
        'de': 'German'
        'fr': 'French'
        'it': 'Italian'
        'nl': 'Dutch, Flemish'
        'ru': 'Russian'
        'uk': 'Ukrainian'
    langattr:
      type: text
      label: 'Language attribute (website)'
      css: lg:w-half
      maxlength: 5
      description: 'Used for frontend language attribute. Please use ISO 639-1 codes like "en".'
    sitemap:
      type: text
      label: 'Google sitemap (readonly)'
      css: lg:w-half
      disabled: true
      description: 'Submit the url above in google search console to support indexing.'
    disableSitemap:
      type: checkbox
      css: lg:w-half
      label: 'Disable Sitemap Generation'
      checkboxlabel: 'Disable Sitemap generation to improve the performance for publish action.'
fieldsetproject:
  type: fieldset
  legend: Projects
  fields:
    projecthint: 
      type: paragraph
      label: 'Notice'
      description: 'Create multiple projects with their own navigation. Use it for different products, versions, languages, or books.'
    projects:
      type: radio
      label: 'Multi-Project Website'
      options:
        'standard': 'Disabled (Standard Website)'
        'projects': 'Create a multi-project website'
        'languages': 'Create a multi-language website'
    autotranslate:
      type: checkbox
      label: 'AI auto-translation'
      checkboxlabel: 'Auto-translate pages for multi-language webseites'
    projectswitch:
      type: checkbox
      label: 'Frontend Project Switch'
      checkboxlabel: 'Add a project switch to the frontend website'
    projecthome:
      type: checkbox
      label: 'Project Homepage'
      checkboxlabel: 'The logo should target to the project homepage (depending on the theme)'
    baseprojectid:
      type: text
      label: 'Base Project ID'
      placeholder: 'base'
      description: 'The id will be used to identify your base website.'
      css: 'w-full'
    baseprojectlabel:
      type: text
      label: 'Base Project Label'
      placeholder: 'Homebase'
      description: 'The label/name will be use to create a visible switch between projects.'
      css: 'w-full'
    projectinstances:
      type: customfields
      label: 'Additional Projects (ID | label)'
      description: 'For each project, add an ID on the left and a Label on the right. The id will be used as url segment, the label to switch between projects.'
      keypattern: '[a-z0-9]+'
fieldsetmedia:
  type: fieldset
  legend: Media
  fields:
    mediahint: 
      type: paragraph
      label: 'Notice'
      description: 'Upload a logo and favicon, set default image sizes, and manage SVG or file uploads.'
    logo:
      type: image
      label: Logo
    favicon:
      type: image
      label: Favicon
      description: 'Only PNG format will work.'
      keepformat: true
    liveimagewidth:
      type: number
      label: 'Standard width for live pictures'
      placeholder: 820
      description: 'Default width of live images is 820px. Changes will apply to future uploads.'
      css: lg:w-half
    liveimageheight:
      type: number
      label: 'Standard height for live pictures'
      description: 'If you add a value for the height, then the image will be cropped.'
      css: lg:w-half
    maximageuploads:
      type: number
      label: 'Maximum size for image uploads in MB'
      description: 'The maximum image size might be limited by your server settings.'
    allowsvg:
      type: checkbox
      label: Allow svg
      checkboxlabel: 'Allow the upload of svg images.'
    convertwebp:
      type: checkbox
      label: 'Convert to webp'
      checkboxlabel: 'Try to convert uploaded images into the webp-format for better performance.'
    maxfileuploads:
      type: number
      label: 'Maximum size for file uploads in MB'
      description: 'The maximum file size might be limited by your server settings.'
fieldsetwriting:
  type: fieldset
  legend: Writing
  fields:
    writinghint: 
      type: paragraph
      label: 'Notice'
      description: 'Choose the default editor (visual or raw markdown) and enable buttons for different content types.'
    editor:
      type: radio
      label: 'Standard editor mode'
      css: lg:w-half
      options:
        'visual': 'visual editor'
        'raw': 'raw editor'
    formats:
      type: checkboxlist
      label: 'Format options for visual editor'
      css: lg:w-half
      options:
        'markdown': 'markdown'
        'headline': 'headline'
        'ulist': 'numbered list'
        'olist': 'bullet list'
        'table': 'table'
        'quote': 'quote'
        'notice': 'notice'
        'image': 'image'
        'video': 'video'
        'audio': 'audio'
        'file': 'file'
        'toc': 'table of contents'
        'hr': 'horizontal line'
        'definition': 'definition list'
        'code': 'code'
        'shortcode': 'shortcode'
        'youtube': 'YouTube (deprecated)'
    headlineanchors:
      type: checkbox
      label: 'Headline anchors'
      checkboxlabel: 'Show anchors next to headline in frontend'
    urlschemes:
      type: text
      label: 'Url schemes'
      description: 'Add more url schemes for external links e.g. like dict:// (comma separated list)'
      maxlength: 60
fieldsetaccess:
  type: fieldset
  legend: Access
  fields:
    accesshint: 
      type: paragraph
      label: 'Notice'
      description: 'Restrict access to the entire website or individual pages. Cookies are used for all frontend pages when restrictions are enabled.'
    access:
      type: checkbox
      label: 'Website restriction'
      checkboxlabel: 'Show the website only to authenticated users and redirect all other users to the login page.'
    pageaccess:
      type: checkbox
      label: 'Page restriction'
      checkboxlabel: 'Activate individual restrictions for pages in the meta-tab of each page.'
    hiderestrictedpageslive:
      type: checkbox
      label: 'Hide Restricted Pages in Frontend'
      checkboxlabel: 'Hide restricted pages in the navigation for users without rights in frontend.'
      description: 'Be aware that this feature can slow down performance for large websites with many pages.'
    hrdelimiter:
      type: checkbox
      label: 'Content break'
      checkboxlabel: 'Cut restricted content after the first hr-element on a page (per default content will be cut after title).'
    restrictionnotice:
      type: textarea
      label: 'Restriction notice (use markdown)'
      maxlength: 2000
    wraprestrictionnotice:
      type: checkbox
      label: 'Wrap restriction notice'
      checkboxlabel: 'Wrap the restriction notice above into a notice-4 element (which can be designed as special box)'
fieldsetauthpage:
  type: fieldset
  legend: Login
  fields:
    authpagehint:
      type: paragraph
      label: 'Notice'
      description: 'Customize the authentication pages and define where users are redirected after login.'
    authpagebgcolor:
      type: text
      label: 'Background color (form side)'
      placeholder: '#0d9488'
      css: lg:w-half
    authpagetextcolor:
      type: text
      label: 'Text color (form side)'
      placeholder: '#ffffff'
      css: lg:w-half
    authpagerightbg:
      type: text
      label: 'Background color (info side)'
      placeholder: '#ffffff'
      css: lg:w-half
    authpagerighttextcolor:
      type: text
      label: 'Text color (info side)'
      placeholder: '#000000'
      css: lg:w-half
    authpagerightcontent:
      type: textarea
      label: 'Content for login page (use markdown)'
      description: 'If empty, the login page shows the default text. If filled, this content is shown on the login page only. Other pages like password recovery always show their original content.'
      maxlength: 2000
    authpagestacked:
      type: checkbox
      label: 'Stacked layout (top/bottom instead of left/right)'
      checkboxlabel: 'Use a top/bottom layout for all authentication pages'
      description: 'If activated, the info text appears at the top and the form below on all screen sizes.'
    redirectadminrights:
      type: select
      label: 'After login redirect users with admin rights to'
      css: lg:w-half      
      options:
        settings.show: 'system page'
        content: 'editor page'
        user.account: 'account page'
        home: 'home page (frontend)'
    redirectcontentrights:
      type: select
      label: 'After login redirect users with edit rights to'
      css: lg:w-half
      options:
        content: 'editor page'
        user.account: 'account page'
        home: 'home page (frontend)'
    redirectaccountrights:
      type: select
      label: 'After login redirect users without edit rights to'
      css: lg:w-half
      options:
        user.account: 'account page'
        home: 'home page (frontend)'
fieldsetmail:
  type: fieldset
  legend: Email
  fields:
    mailhint: 
      type: paragraph
      label: 'Notice'
      description: 'Set up mail to send emails from your website. Required for features like password reset or login verification.'
    mailfrom:
      type: email
      label: 'Mail From (required)'
      placeholder: sender@yourmail.org
      maxlength: 100
      description: 'Enter an email address that sends the e-mails (sender). The e-mail-feature will be used for recovery and verification e-mails. Send a testmail to your user-account to verify that you receive the e-mails.'
    mailfromname:
      type: text
      label: 'Mail From Name (optional)'
      placeholder: sender name
      maxlength: 100
      description: 'Optionally enter a name for the sender address. If not set, the from-address will be visible.'
    replyto:
      type: text
      label: 'Reply To (optional)'
      placeholder: noreply@yourmail.org
      maxlength: 100
      description: 'Optionally enter a "reply to" address for answers from the receiver. If not set, answers will go to the from-address.'
    mailsmtp:
      type: checkbox
      label: 'Use SMTP'
      checkboxlabel: 'Send mails via SMTP instead of PHP mail()'
      description: 'Activate SMTP to send mails via an external mail provider. Required for Docker and most hosting environments.'
    mailhost:
      type: text
      label: 'SMTP Host'
      placeholder: 'smtp.gmail.com'
      maxlength: 100
    mailport:
      type: text
      label: 'SMTP Port'
      placeholder: '587'
      maxlength: 10
    mailsmtpsecure:
      type: select
      label: 'SMTP Security'
      options:
        '': None
        ssl: SSL/TLS
        tls: TLS/STARTTLS
    mailsmtpauth:
      type: checkbox
      label: 'SMTP Authentication'
      checkboxlabel: 'Authenticate via SMTP'
    mailusername:
      type: email
      label: 'SMTP Username'
      placeholder: 'your@email.com'
      autocomplete: off
      maxlength: 100
    mailpassword:
      type: password
      label: 'SMTP Password'
      autocomplete: new-password
      description: 'For security reasons, your password is stored separately and will not be visible again after you leave this page.'
fieldsetrecover:
  type: fieldset
  legend: Password
  fields:
    recoverhint:
      type: paragraph
      label: 'Notice'
      description: 'Enable password recovery only if needed and ensure email settings are configured correctly. To improve security, configure a Fully Qualified Domain Name (FQDN) in the Developer settings. Without an FQDN, password reset links may be vulnerable to manipulation on certain server configurations.'
    recoverpw:
      type: checkbox
      label: 'Recover password'
      checkboxlabel: 'Activate a password recovery in the login form.'
      description: "From mail is required for this feature. Send a testmail before you use this feature."
    recoversubject:
      type: text
      label: 'Email subject'
      placeholder: 'Recover your password'
      maxlength: 60
    recovermessage:
      type: textarea
      label: 'Text before recover link in email message'
      description: 'The recover-link will be active for 24 hours.'
      maxlength: 2000
fieldsetsecurity:
  type: fieldset
  legend: Security
  fields:
    securityhint: 
      type: paragraph
      label: 'Notice'
      description: 'Enable login verification to send confirmation codes via email after login. Requires a working mail setup.'
    authcode:
      type: checkbox
      label: 'Login Verification (recommended)'
      checkboxlabel: 'Verify your login with a 5-digit code send by email.'
      description: 'From mail is required for this feature. Send a testmail before you use this feature. Make sure you have ftp-access to disable the feature in settings.yaml on failure. The verification code will be valid for 5 minutes. Be aware that device fingerprints will be stored in the user accounts.'
    authcaptcha:
      type: radio
      label: 'Use captcha in authentication forms'
      options:
        disabled: 'Disable'
        standard: 'Always show'
        aftererror: 'Show after first wrong input'
    securitylog:
      type: checkbox
      label: 'Security log'
      checkboxlabel: 'Track spam and suspicious actions in a logfile'
fieldsetdeveloper:
  type: fieldset
  legend: "Developer"
  fields:
    devhint: 
      type: paragraph
      label: 'Notice'
      description: 'Advanced options such as proxy configuration, error reporting, or CSP rules.'
    displayErrorDetails:
      type: checkbox
      label: "Error reporting"
      checkboxlabel: "Display application errors"
    twigcache:
      type: checkbox
      label: "Twig cache"
      checkboxlabel: "Activate the cache for twig templates"
    autorefresh:
      type: checkbox
      label: "Auto-Refresh Navigation"
      checkboxlabel: "Enable to refresh the navigation automatically at regular intervals"
    refreshtimer:
      type: number
      label: "Refresh Interval (Minutes)"
      placeholder: 10
      description: "Define how often the navigation should be refreshed (in minutes)"
    proxy:
      type: checkbox
      label: "Proxy"
      checkboxlabel: "Use x-forwarded-header"
    trustedproxies:
      type: text
      label: "Trusted IPs for proxies (comma separated)"
      placeholder: "192.168.1.1, 203.0.113.0"
      description: "Restrict proxies to certain IP adresses."
    fqdn:
      type: text
      label: "FQDN (Fully Qualified Domain Name)"
      placeholder: "https://mywebsite.com"
      description: "If your proxy does not work, add the base-url of your website here."
    headersoff:
      type: checkbox
      label: "Disable Custom Headers"
      checkboxlabel: "Disable all custom headers of Typemill (except cors) and send your own headers instead."
    cspdisabled:
      type: checkbox
      label: "Disable CSP Headers"
      checkboxlabel: "Disable all csp headers (content security policy) for this website."
    cspdomains:
      type: textarea
      label: "Allowed Domains for Content on Typemill (CSP-Headers)"
      placeholder: 'https://www.google.com,*google.com'
      description: "List all domains, separated by commas, to allow content integration, such as iframes, on your Typemill website. Domains will be added to the csp-header. Usually done with plugins and themes, but add manually if something is blocked."
#    corsdomains:
#      type: textarea
#      label: "Allowed Domains for API-Access (CORS-Headers)"
#      placeholder: 'https://my-website-that-uses-the-api.org,https://another-website-using-the-api.org'
#      description: "List all domains, separated by comma, that should have access to the Typemill API. Domains will be added to the cors-header."
    trustedipsforapi:
      type: text
      label: "Trusted IPs for api access (comma separated)"
      placeholder: "192.168.1.1, 203.0.113.0"
      description: "Restrict api access to IPs for more security and if IPs are static."
    trustedhostsforapi:
      type: text
      label: "Trusted Hosts for api access (comma separated)"
      placeholder: "mydomain.org,sub.mydomain.org"
      description: "Restrict api access to hosts for more security and if IPs are dynamic or unknown."
    loginlink:
      type: checkbox
      label: "Login with link"
      checkboxlabel: "Allow selected guest-users to login with a login link."
      description: "If activated, you can allow login-links with a checkbox in the user profile. This is only available for guest-roles since guests do not have any rights. Login with a link can be helpful if you link from your software to a non-public documentation. Be aware of the low protection that this kind of logins has. If you integrate such links in a SaaS-software, then you should restrict access with login-links to your ips."
    trustedloginreferrer:
      type: text
      label: "Trusted IPs or HOSTs for the login-link-referrer (comma separated)"
      placeholder: "mydomain.com,docs.mydomain.com,127.0.0.1"
      description: "Keep empty to allow loginlinks from all IPs and Domains."
fieldsetai:
  type: fieldset
  legend: AI
  fields:
    aiprivacy:
      type: paragraph
      label: "Notice"
      description: "Connect Typemill to any OpenAI-compatible AI provider (OpenAI, Ollama, LM Studio, OpenRouter, ...) or to Anthropic (Claude). For local providers like Ollama no API key is needed. If you use a cloud provider, user inputs will be sent to that external service. Ensure compliance with your local data privacy regulations. Each user will be asked for confirmation before using AI features."
    ai_adapter:
      type: select
      label: "AI Adapter"
      description: "Select 'OpenAI-compatible' for OpenAI, Ollama, LM Studio, OpenRouter, and most other providers. Select 'Anthropic' for Claude."
      options:
        none: 'None (disabled)'
        openai: 'OpenAI-compatible (OpenAI, Ollama, LM Studio, OpenRouter ...)'
        anthropic: 'Anthropic (Claude)'
    ai_base_url:
      type: text
      label: "API Base URL"
      placeholder: "http://localhost:11434/v1"
      description: "The base URL of your AI provider. Examples: https://api.openai.com/v1 (OpenAI), http://localhost:11434/v1 (Ollama), http://localhost:1234/v1 (LM Studio), https://api.anthropic.com/v1 (Claude). Do not add a trailing slash. Only point this to trusted endpoints."
      maxlength: 200
    ai_model:
      type: text
      label: "Model"
      placeholder: "llama3"
      description: "The model name as expected by your provider. Examples: gpt-4.1, llama3, mistral, claude-sonnet-4."
      maxlength: 100
    ai_api_key:
      type: password
      label: "API Key"
      autocomplete: new-password
      generator: false
      description: "Your API key. Leave empty for local providers like Ollama or LM Studio that do not require authentication. For security reasons your key is stored separately and will not be visible again after you leave this page."
    ai_provider_name:
      type: text
      label: "Provider Name"
      placeholder: "OpenAI"
      description: "A human-readable name for your AI provider (e.g. 'OpenAI', 'My Ollama Server'). This name is shown to users on the agreement screen. Leave empty to show the adapter type instead."
      maxlength: 100
    ai_provider_terms:
      type: text
      label: "Terms & Conditions URL"
      placeholder: "https://openai.com/policies/terms-of-use"
      description: "Optional link to the terms and conditions of your AI provider. Shown to users on the agreement screen. Leave empty for local providers that have no terms."
      maxlength: 500
    aitemperature:
      type: select
      label: 'Temperature (strict/creative)'
      description: "Default: 0.7 (0.1 = very strict, 1.0 = very creative)"
      class: "w-half"
      options:
        '0.1': '0.1'
        '0.2': '0.2'
        '0.3': '0.3'
        '0.4': '0.4'
        '0.5': '0.5'
        '0.6': '0.6'
        '0.7': '0.7'
        '0.8': '0.8'
        '0.9': '0.9'
        '1.0': '1.0'
    aioutputtoken:
      type: select
      label: 'Maximum output tokens'
      description: "Default: 4000 (output tokens determine the length/cost of answers)"
      class: "w-half"
      options:
        '2000': '2000 (Chat)'
        '4000': '4000 (Docs)'
        '6000': '6000 (Analysis)'
        '8000': '8000 (Research)'
        '10000': '10000 (High)'
        '12000': '12000 (Max)'
    aitimeout:
      type: select
      label: 'AI request timeout'
      description: "Default: 120 sec (increase for very long articles)"
      class: "w-half"
      options:
        '120': '120 sec (default)'
        '180': '180 sec'
        '240': '240 sec'
        '300': '300 sec'
        '360': '360 sec'
        '420': '420 sec'
        '480': '480 sec'
        '600': '600 sec'